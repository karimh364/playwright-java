name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Instalar Chromium y sus dependencias
        run: ./gradlew installPlaywrightCI

      - name: Ejecutar tests
        run: ./gradlew test

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-evidencias
          path: |
            build/reports/tests/test/
            build/test-results/test/
            build/traces/
            build/screenshots/
          if-no-files-found: warn
          retention-days: 14